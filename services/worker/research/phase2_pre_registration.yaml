# Cross-product cardinality budget
# ~8-10 conditions × ~100 TA variants = ~800-1000 naive per stock
# Channel gating reduces to ~30-50 applicable per stock (3-4 factors per sector)
# Two independent FDR universes at q=0.10 within each stock

# Headline claim criterion (incremental value)
# A factor-conditioned variant is "value-adding" only if:
#   bootstrap 95% CI lower bound on (Sharpe_fx_ta - Sharpe_native_ta_baseline) > 0
#   Stationary bootstrap, >= 5000 resamples
# DSR for headline claims uses combined trial count across both FDR universes
