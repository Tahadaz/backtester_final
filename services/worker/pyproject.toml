[project]
name = "quant-worker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "rq>=1.16",
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "quant-core",   # depends on your core package
  "boto3>=1.34",
  "openpyxl>=3.1",
  "pyarrow>=14",
  "yfinance",
  "openpyxl",
  "numba",
  "rq-scheduler",
]

# ✅ CRITICAL: tell setuptools what to package, exclude alembic folder from package discovery
[tool.setuptools]
packages = { find = { where = ["."], exclude = ["alembic*", "tests*", "scripts*"] } }

[tool.uvicorn]
factory = false
