[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-core"
version = "0.1.0"
description = "Research-grade quant core library (data/indicators/strategies/portfolio/results)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas<3",
  "plotly",
  "pydantic>=2.6",
  "ruptures>=1.1",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_core*"]
