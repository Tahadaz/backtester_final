name: deploy-vm

on:
  workflow_run:
    workflows: [build-images]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle VM (84.8.218.252)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: deploy
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/bt

            # Keep the currently-running release available for one rollback.
            # The housekeeping timer reads these immutable image IDs and never
            # deletes them, even when their commit tags are otherwise unused.
            docker ps -aq --filter name='^/quant_(api|frontend|worker)' \
              | xargs -r docker inspect -f '{{.Image}}' \
              | sort -u > /opt/bt/.rollback-image-ids

            # Pull latest compose + config
            git fetch --quiet
            git reset --hard origin/main

            # Pull new images
            IMAGE_TAG=${{ github.event.workflow_run.head_sha }} \
              docker compose --env-file /etc/bt/env \
              -f infra/docker-compose.prod.yml pull

            # Run Python DB migrations
            IMAGE_TAG=${{ github.event.workflow_run.head_sha }} \
              docker compose --env-file /etc/bt/env \
              -f infra/docker-compose.prod.yml \
              run --rm quant_api \
              alembic -c services/api/alembic.ini upgrade head

            # Bring everything up
            IMAGE_TAG=${{ github.event.workflow_run.head_sha }} \
              docker compose --env-file /etc/bt/env \
              -f infra/docker-compose.prod.yml \
              up -d --remove-orphans

            # Dashboard snapshot mode serves persisted rows. Rebuild them with
            # the freshly deployed image so payload-shape changes do not leave
            # the dashboard returning 503 until the nightly refresh runs.
            IMAGE_TAG=${{ github.event.workflow_run.head_sha }} timeout --signal=TERM --kill-after=30s 20m \
              docker compose --env-file /etc/bt/env \
              -f infra/docker-compose.prod.yml \
              run --rm --no-deps quant_worker \
              python - <<'PY'
            import sys
            from services.worker.tasks.dashboard_snapshot import refresh_dashboard_snapshot

            result = refresh_dashboard_snapshot()
            print(result)
            if not result or not all(result.values()):
                sys.exit(1)
            PY

            bash infra/scripts/docker_housekeeping.sh

      # Rebuild best-evidence snapshots so the signal-evidence tab serves fresh
      # data immediately after deploy rather than waiting until the next Monday
      # refresh. This is best-effort: it recomputes the S/R overlay across the
      # whole universe and can run long, so it is a separate continue-on-error
      # step with a generous command_timeout. A timeout or partial result must
      # never fail the deploy — the containers are already up and healthy, and
      # the weekly batch refreshes any symbols not reached here.
      - name: Refresh best-evidence snapshots (best-effort)
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: deploy
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/bt
            IMAGE_TAG=${{ github.event.workflow_run.head_sha }} \
              docker compose --env-file /etc/bt/env \
              -f infra/docker-compose.prod.yml \
              run --rm --no-deps quant_worker \
              python - <<'PY'
            import sys
            from services.worker.tasks.signal_best_evidence_snapshot import refresh_signal_best_evidence_snapshot
            result = refresh_signal_best_evidence_snapshot()
            print(result)
            sys.exit(0 if result.get("status") in {"succeeded", "partial"} else 1)
            PY

      - name: Smoke test on Oracle VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: deploy
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/bt

            DOMAIN="${{ secrets.DOMAIN }}"
            if [ -z "$DOMAIN" ] && [ -f /etc/bt/env ]; then
              DOMAIN="$(sed -n 's/^DOMAIN=//p' /etc/bt/env | tail -n 1)"
            fi
            DOMAIN="${DOMAIN:-84.8.218.252.sslip.io}"

            for i in $(seq 1 30); do
              if curl -fsS --max-time 10 --resolve "${DOMAIN}:443:127.0.0.1" "https://${DOMAIN}/api/health" | grep -q '"ok"'; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "API health smoke test failed" >&2
                exit 1
              fi
              sleep 5
            done

            curl -fsS --max-time 10 --resolve "${DOMAIN}:443:127.0.0.1" "https://${DOMAIN}/login" | grep -q "Connexion"
            IMAGE_TAG=${{ github.event.workflow_run.head_sha }} \
              docker compose --env-file /etc/bt/env \
              -f infra/docker-compose.prod.yml \
              exec -T quant_api \
              python - <<'PY'
            import os
            import urllib.request

            api_key = os.environ["API_KEY"]
            for horizon in ("weekly", "monthly", "quarterly"):
                req = urllib.request.Request(
                    f"http://127.0.0.1:8000/dashboard/data/{horizon}",
                    headers={"X-API-Key": api_key},
                )
                with urllib.request.urlopen(req, timeout=30) as resp:
                    if resp.status != 200:
                        raise RuntimeError(f"{horizon} dashboard returned {resp.status}")
                    resp.read(1)
            PY
            IMAGE_TAG=${{ github.event.workflow_run.head_sha }} \
              docker compose --env-file /etc/bt/env \
              -f infra/docker-compose.prod.yml ps
