name: deploy-vm

on:
  workflow_run:
    workflows: [build-images]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle VM (84.8.218.252)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: deploy
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/bt

            # Pull latest compose + config
            git fetch --quiet
            git reset --hard origin/main

            # Pull new images
            IMAGE_TAG=${{ github.event.workflow_run.head_sha }} \
              docker compose --env-file /etc/bt/env \
              -f infra/docker-compose.gcp.yml pull

            # Run Python DB migrations
            IMAGE_TAG=${{ github.event.workflow_run.head_sha }} \
              docker compose --env-file /etc/bt/env \
              -f infra/docker-compose.gcp.yml \
              run --rm quant_api \
              alembic -c services/api/alembic.ini upgrade head

            # Bring everything up
            IMAGE_TAG=${{ github.event.workflow_run.head_sha }} \
              docker compose --env-file /etc/bt/env \
              -f infra/docker-compose.gcp.yml \
              up -d --remove-orphans

            # Prune old images
            docker image prune -f

      - name: Smoke test on Oracle VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: deploy
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/bt

            DOMAIN="${{ secrets.DOMAIN }}"
            if [ -z "$DOMAIN" ] && [ -f /etc/bt/env ]; then
              DOMAIN="$(sed -n 's/^DOMAIN=//p' /etc/bt/env | tail -n 1)"
            fi
            DOMAIN="${DOMAIN:-84.8.218.252.sslip.io}"

            for i in $(seq 1 30); do
              if curl -fsS --max-time 10 --resolve "${DOMAIN}:443:127.0.0.1" "https://${DOMAIN}/api/health" | grep -q '"ok"'; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "API health smoke test failed" >&2
                exit 1
              fi
              sleep 5
            done

            curl -fsS --max-time 10 --resolve "${DOMAIN}:443:127.0.0.1" "https://${DOMAIN}/login" | grep -q "Connexion"
            IMAGE_TAG=${{ github.event.workflow_run.head_sha }} \
              docker compose --env-file /etc/bt/env \
              -f infra/docker-compose.gcp.yml ps
