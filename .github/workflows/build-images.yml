name: build-images

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "core/**"
      - "frontend/**"
      - "pyproject.toml"
      - "infra/**"

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/tahadaz/bt-api:${{ github.sha }}
            ghcr.io/tahadaz/bt-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/worker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/tahadaz/bt-worker:${{ github.sha }}
            ghcr.io/tahadaz/bt-worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/tahadaz/bt-frontend:${{ github.sha }}
            ghcr.io/tahadaz/bt-frontend:latest
          build-args: |
            NEXT_BUILD_TARGET=app
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
