name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [dashboard-publish]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build static site
        run: |
          cd frontend
          NEXT_PUBLIC_BASE_PATH="/${{ github.event.repository.name }}" NEXT_PUBLIC_DASHBOARD_PUBLIC_ONLY="true" npm run build:pages

      - name: Prune non-dashboard routes
        run: |
          cd frontend
          npm run prune:pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
