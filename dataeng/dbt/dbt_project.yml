# dbt_project.yml — the project manifest. Committed to git.
# Declares the project name, where dbt should look for things, and the DEFAULT
# materialization for each folder of models. Individual models can override these.

name: 'quant_warehouse'
version: '1.0.0'
config-version: 2

# Which profile (connection) in ~/.dbt/profiles.yml to use. Names must match.
profile: 'quant_warehouse'

# Standard dbt folder conventions.
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"          # compiled SQL + run artifacts (git-ignored)
clean-targets: ["target", "dbt_packages"]

# Default materializations per layer (the medallion mapping):
#   staging  -> views   (silver: cheap, always-fresh, just cleaned columns)
#   marts    -> tables  (gold: physical star schema, fast to query)
# Custom +schema appends to the profile's target schema, so:
#   analytics_staging  and  analytics_marts
models:
  quant_warehouse:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
