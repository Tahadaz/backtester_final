# Third-party dbt packages. `dbt deps` installs these into dbt_packages/ (git-ignored).
# dbt_utils gives us battle-tested helpers: surrogate_key(), date_spine(),
# and extra generic tests like accepted_range — so we don't reinvent them.
packages:
  - package: dbt-labs/dbt_utils
    version: [">=1.1.0", "<2.0.0"]
