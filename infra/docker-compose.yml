services:
  quant_postgres:
    image: postgres:16
    container_name: quant_postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: quant
    ports:
      - "5555:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  quant_redis:
    image: redis:7
    container_name: quant_redis
    ports:
      - "6379:6379"

  quant_minio:
    image: minio/minio
    container_name: quant_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      default:
        aliases:
          - minio
    volumes:
      - miniodata:/data
  
  quant_worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      REDIS_URL: redis://quant_redis:6379/0
      DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
      RUNS_QUEUE_NAME: runs
      DEFAULTS_DISCOVERY_QUEUE_NAME: defaults_discovery
      WORKER_QUEUES: runs
      RUN_HEARTBEAT_INTERVAL_SECONDS: "15"
      RUN_ORPHAN_STALE_SECONDS: "600"
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: quant-artifacts
      PYTHONPATH: /app
    depends_on:
      - quant_postgres
      - quant_redis
      - quant_minio
    volumes:
      - featurecache:/app/.cache
      - ../services/worker:/repo/services/worker
      - ../core:/repo/core
    healthcheck:
      test: ["CMD-SHELL", "python - << 'PY'\nfrom redis import Redis\nimport os\nr=Redis.from_url(os.environ['REDIS_URL'])\nassert r.ping()\nprint('ok')\nPY"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    command: python -m services.worker.worker
    restart: unless-stopped

  quant_worker_defaults:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      REDIS_URL: redis://quant_redis:6379/0
      DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
      RUNS_QUEUE_NAME: runs
      DEFAULTS_DISCOVERY_QUEUE_NAME: defaults_discovery
      WORKER_QUEUES: defaults_discovery
      RUN_HEARTBEAT_INTERVAL_SECONDS: "15"
      RUN_ORPHAN_STALE_SECONDS: "600"
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: quant-artifacts
      PYTHONPATH: /app
    depends_on:
      - quant_postgres
      - quant_redis
      - quant_minio
    volumes:
      - featurecache:/app/.cache
      - ../services/worker:/repo/services/worker
      - ../core:/repo/core
    healthcheck:
      test: ["CMD-SHELL", "python - << 'PY'\nfrom redis import Redis\nimport os\nr=Redis.from_url(os.environ['REDIS_URL'])\nassert r.ping()\nprint('ok')\nPY"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    command: python -m services.worker.worker
    restart: unless-stopped
  
  quant_api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      REDIS_URL: redis://quant_redis:6379/0
      DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
      RUN_JOB_TIMEOUT_SECONDS: "21600"
      RUN_JOB_RESULT_TTL_SECONDS: "86400"
      RUN_JOB_FAILURE_TTL_SECONDS: "604800"
      RUN_JOB_RETRY_MAX: "0"
      RUN_JOB_RETRY_INTERVAL_SECONDS: "60"
      RUNS_QUEUE_NAME: runs
      DEFAULTS_DISCOVERY_QUEUE_NAME: defaults_discovery
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: quant-artifacts
      S3_SECURE: "false"
      PYTHONPATH: /repo
    depends_on:
      - quant_postgres
      - quant_redis
      - quant_minio
    ports:
      - "8000:8000"
    volumes:
      - ../services/api:/repo/services/api
      - ../core:/repo/core
    healthcheck:
      test: ["CMD-SHELL", "python - << 'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\nprint('ok')\nPY"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s




volumes:
  pgdata:
  miniodata:
  featurecache:
