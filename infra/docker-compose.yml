services:
  quant_postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: quant
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "5555:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  quant_redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  quant_minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      default:
        aliases:
          - minio
    volumes:
      - miniodata:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  quant_minio_init:
    image: minio/mc
    depends_on:
      quant_minio:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-ec" ]
    command:
      - >
        i=0; until mc alias set local http://minio:9000 minio minio12345 >/dev/null 2>&1; do
          i=$$((i+1));
          echo "Waiting for MinIO... ($$i)";
          if [ "$$i" -ge 60 ]; then
            echo "ERROR: cannot connect/auth to MinIO" >&2;
            exit 1;
          fi;
          sleep 2;
        done; mc mb --ignore-existing local/quant-artifacts; echo "MinIO bucket ready: quant-artifacts"
    restart: "no"

  quant_db_migrate:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
      PYTHONPATH: /repo
    depends_on:
      quant_postgres:
        condition: service_healthy
    command: alembic -c services/api/alembic.ini upgrade head
    volumes:
      - ../services/api:/repo/services/api
      - ../core:/repo/core
    restart: "no"

  quant_worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      REDIS_URL: redis://quant_redis:6379/0
      DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
      RUNS_QUEUE_NAME: runs
      DEFAULTS_DISCOVERY_QUEUE_NAME: defaults_discovery
      WORKER_QUEUES: runs
      RUN_HEARTBEAT_INTERVAL_SECONDS: "15"
      RUN_ORPHAN_STALE_SECONDS: "600"
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: quant-artifacts
      PYTHONPATH: /repo
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
    depends_on:
      quant_postgres:
        condition: service_healthy
      quant_redis:
        condition: service_healthy
      quant_minio:
        condition: service_healthy
      quant_minio_init:
        condition: service_completed_successfully
      quant_db_migrate:
        condition: service_completed_successfully
    volumes:
      - featurecache:/app/.cache
      - ../services/worker:/repo/services/worker
      - ../core:/repo/core
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - << 'PY'

            from redis import Redis

            import os

            r=Redis.from_url(os.environ['REDIS_URL'])

            assert r.ping()

            print('ok')

            PY"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    command: python -m services.worker.worker
    restart: unless-stopped

  quant_worker_defaults:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      REDIS_URL: redis://quant_redis:6379/0
      DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
      RUNS_QUEUE_NAME: runs
      DEFAULTS_DISCOVERY_QUEUE_NAME: defaults_discovery
      WORKER_QUEUES: defaults_discovery
      RUN_HEARTBEAT_INTERVAL_SECONDS: "15"
      RUN_ORPHAN_STALE_SECONDS: "600"
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: quant-artifacts
      PYTHONPATH: /repo
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
    depends_on:
      quant_postgres:
        condition: service_healthy
      quant_redis:
        condition: service_healthy
      quant_minio:
        condition: service_healthy
      quant_minio_init:
        condition: service_completed_successfully
      quant_db_migrate:
        condition: service_completed_successfully
    volumes:
      - featurecache:/app/.cache
      - ../services/worker:/repo/services/worker
      - ../core:/repo/core
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - << 'PY'

            from redis import Redis

            import os

            r=Redis.from_url(os.environ['REDIS_URL'])

            assert r.ping()

            print('ok')

            PY"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    command: python -m services.worker.worker
    restart: unless-stopped

  quant_api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      REDIS_URL: redis://quant_redis:6379/0
      DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
      RUN_JOB_TIMEOUT_SECONDS: "21600"
      RUN_JOB_RESULT_TTL_SECONDS: "86400"
      RUN_JOB_FAILURE_TTL_SECONDS: "604800"
      RUN_JOB_RETRY_MAX: "0"
      RUN_JOB_RETRY_INTERVAL_SECONDS: "60"
      RUNS_QUEUE_NAME: runs
      DEFAULTS_DISCOVERY_QUEUE_NAME: defaults_discovery
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: quant-artifacts
      S3_SECURE: "false"
      PYTHONPATH: /repo
    depends_on:
      quant_postgres:
        condition: service_healthy
      quant_redis:
        condition: service_started
      quant_minio:
        condition: service_started
      quant_minio_init:
        condition: service_completed_successfully
      quant_db_migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ../services/api:/repo/services/api
      - ../core:/repo/core
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - << 'PY'

            import urllib.request

            urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()

            print('ok')

            PY"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  miniodata:
  featurecache:
