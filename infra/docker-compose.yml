# ---------------------------------------------------------------------------
# Worker scaling notes:
#   Total parallelism per pool = (replicas in pool) × WORKER_CONCURRENCY
#   Default: 4 containers × 4 concurrency = 16 parallel jobs per pool.
#   To scale up: set WORKER_CONCURRENCY=8 in .env (or add more replica services).
#   Tune to your CPU core count — too high causes contention and slows all jobs.
# ---------------------------------------------------------------------------
#
# Airflow (optional — gated behind profile "airflow"):
#   docker compose --profile airflow up    → starts airflow_init, airflow_scheduler, airflow_webserver
#   docker compose up                      → starts ZERO Airflow containers
#   Webserver UI: http://localhost:8081  (login: admin / admin)
#   Port 8081 is used (not 8080) to avoid conflict with `dbt docs serve` on 8080.
#   Airflow metadata DB: separate `airflow` logical database on quant_postgres.
# ---------------------------------------------------------------------------

x-airflow-env: &airflow_env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://app:app@quant_postgres:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__WEBSERVER__SECRET_KEY: "airflow-local-dev-secret-change-in-prod"
  # DAG talks to the app exclusively over HTTP — no RQ/app-lib imports in the image
  API_BASE_URL: http://quant_api:8000
  # dbt env-var profile (container-internal host/port, not the host's 5555)
  DBT_PG_HOST: quant_postgres
  DBT_PG_PORT: "5432"
  DBT_PG_USER: app
  DBT_PG_PASSWORD: app
  DBT_PG_DBNAME: quant
  DBT_PG_SCHEMA: analytics

x-worker-base: &worker_base
  build:
    context: ..
    dockerfile: services/worker/Dockerfile
  depends_on:
    quant_postgres:
      condition: service_healthy
    quant_redis:
      condition: service_healthy
    quant_minio:
      condition: service_healthy
    quant_minio_init:
      condition: service_completed_successfully
    quant_db_migrate:
      condition: service_completed_successfully
  volumes:
    - featurecache:/app/.cache
    - ../services/api:/repo/services/api
    - ../services/worker:/repo/services/worker
    - ../core:/repo/core
    - ../data:/repo/data
  command: python -m services.worker.worker
  restart: unless-stopped

x-wfo-worker-base: &wfo_worker_base
  <<: *worker_base
  environment:
    REDIS_URL: redis://quant_redis:6379/0
    DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
    RUNS_QUEUE_NAME: runs
    DEFAULTS_DISCOVERY_QUEUE_NAME: defaults_discovery
    WORKER_QUEUES: wfo_signals
    S3_ENDPOINT: http://minio:9000
    S3_PRESIGN_ENDPOINT_URL: http://127.0.0.1:9000
    S3_ACCESS_KEY: minio
    S3_SECRET_KEY: minio12345
    S3_BUCKET: quant-artifacts
    PYTHONPATH: /repo
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
    MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
    OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}

x-signal-engine-worker-base: &signal_engine_worker_base
  <<: *worker_base
  environment:
    REDIS_URL: redis://quant_redis:6379/0
    DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
    RUNS_QUEUE_NAME: runs
    DEFAULTS_DISCOVERY_QUEUE_NAME: defaults_discovery
    WORKER_QUEUES: signal_engine
    S3_ENDPOINT: http://minio:9000
    S3_PRESIGN_ENDPOINT_URL: http://127.0.0.1:9000
    S3_ACCESS_KEY: minio
    S3_SECRET_KEY: minio12345
    S3_BUCKET: quant-artifacts
    PYTHONPATH: /repo
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
    MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
    OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}

x-score-history-worker-base: &score_history_worker_base
  <<: *worker_base
  environment:
    REDIS_URL: redis://quant_redis:6379/0
    DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
    WORKER_QUEUES: score_history
    S3_ENDPOINT: http://minio:9000
    S3_PRESIGN_ENDPOINT_URL: http://127.0.0.1:9000
    S3_ACCESS_KEY: minio
    S3_SECRET_KEY: minio12345
    S3_BUCKET: quant-artifacts
    PYTHONPATH: /repo
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
    MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
    OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}

services:
  quant_postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: quant
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "5555:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  quant_redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  quant_minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      default:
        aliases:
          - minio
    volumes:
      - miniodata:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  quant_minio_init:
    image: minio/mc
    depends_on:
      quant_minio:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-ec" ]
    command:
      - >
        i=0; until mc alias set local http://minio:9000 minio minio12345 >/dev/null 2>&1; do
          i=$$((i+1));
          echo "Waiting for MinIO... ($$i)";
          if [ "$$i" -ge 60 ]; then
            echo "ERROR: cannot connect/auth to MinIO" >&2;
            exit 1;
          fi;
          sleep 2;
        done; mc mb --ignore-existing local/quant-artifacts; echo "MinIO bucket ready: quant-artifacts"
    restart: "no"

  quant_db_migrate:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
      PYTHONPATH: /repo
    depends_on:
      quant_postgres:
        condition: service_healthy
    command: alembic -c services/api/alembic.ini upgrade head
    volumes:
      - ../services/api:/repo/services/api
      - ../core:/repo/core
    restart: "no"

  quant_worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      REDIS_URL: redis://quant_redis:6379/0
      DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
      RUNS_QUEUE_NAME: runs
      DEFAULTS_DISCOVERY_QUEUE_NAME: defaults_discovery
      WORKER_QUEUES: runs,market_refresh,signal_backtest,score_history
      SIGNAL_ENGINE_REFRESH_ON_MARKET_REFRESH: "1"
      RUN_HEARTBEAT_INTERVAL_SECONDS: "15"
      RUN_ORPHAN_STALE_SECONDS: "600"
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: quant-artifacts
      FUNDAMENTAL_LLM_API_KEYS: ${FUNDAMENTAL_LLM_API_KEYS:-}
      FUNDAMENTAL_LLM_MODEL: ${FUNDAMENTAL_LLM_MODEL:-gemma-4-31b-it}
      FUNDAMENTAL_LLM_BASE_URL: ${FUNDAMENTAL_LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      FAMA_FRENCH_DIR: /bvc/fama-french
      FAMA_FRENCH_MARKET_REFERENCE_WORKBOOK: /bvc/fama-french/data/raw/fundamental_data_all_structured.xlsx
      FAMA_FRENCH_HISTORICAL_WORKBOOK: /bvc/fama-french/data/raw/fundamental_data_yearly.xlsx
      PYTHONPATH: /repo
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
    depends_on:
      quant_postgres:
        condition: service_healthy
      quant_redis:
        condition: service_healthy
      quant_minio:
        condition: service_healthy
      quant_minio_init:
        condition: service_completed_successfully
      quant_db_migrate:
        condition: service_completed_successfully
    volumes:
      - featurecache:/app/.cache
      - ../services/api:/repo/services/api
      - ../services/worker:/repo/services/worker
      - ../core:/repo/core
      - ../frontend:/repo/frontend
      - ../data:/repo/data
      - type: bind
        source: ${FAMA_FRENCH_HOST_DIR:-C:/Users/taha/Downloads/fama french}
        target: /bvc/fama-french
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - << 'PY'

            from redis import Redis

            import os

            r=Redis.from_url(os.environ['REDIS_URL'])

            assert r.ping()

            print('ok')

            PY"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    command: python -m services.worker.worker
    restart: unless-stopped

  quant_worker_defaults:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      REDIS_URL: redis://quant_redis:6379/0
      DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
      RUNS_QUEUE_NAME: runs
      DEFAULTS_DISCOVERY_QUEUE_NAME: defaults_discovery
      WORKER_QUEUES: defaults_discovery
      RUN_HEARTBEAT_INTERVAL_SECONDS: "15"
      RUN_ORPHAN_STALE_SECONDS: "600"
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: quant-artifacts
      PYTHONPATH: /repo
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
    depends_on:
      quant_postgres:
        condition: service_healthy
      quant_redis:
        condition: service_healthy
      quant_minio:
        condition: service_healthy
      quant_minio_init:
        condition: service_completed_successfully
      quant_db_migrate:
        condition: service_completed_successfully
    volumes:
      - featurecache:/app/.cache
      - ../services/worker:/repo/services/worker
      - ../core:/repo/core
      - ../frontend:/repo/frontend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - << 'PY'

            from redis import Redis

            import os

            r=Redis.from_url(os.environ['REDIS_URL'])

            assert r.ping()

            print('ok')

            PY"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    command: python -m services.worker.worker
    restart: unless-stopped

  quant_worker_wfo_1:
    <<: *wfo_worker_base
  quant_worker_wfo_2:
    <<: *wfo_worker_base
  quant_worker_wfo_3:
    <<: *wfo_worker_base
  quant_worker_wfo_4:
    <<: *wfo_worker_base

  # Dedicated signal-engine pool: 4 workers × WORKER_CONCURRENCY = 16 parallel jobs by default
  quant_worker_signal_engine_1:
    <<: *signal_engine_worker_base
  quant_worker_signal_engine_2:
    <<: *signal_engine_worker_base
  quant_worker_signal_engine_3:
    <<: *signal_engine_worker_base
  quant_worker_signal_engine_4:
    <<: *signal_engine_worker_base

  # Dedicated score-history pool: 2 workers (DB-bound, ~30s/symbol, 73 symbols ≈ 5 min)
  quant_worker_score_history_1:
    <<: *score_history_worker_base
  quant_worker_score_history_2:
    <<: *score_history_worker_base

  quant_scheduler:
    <<: *worker_base
    environment:
      # Automatic schedules run only in deployed environments. Set to "1" there.
      WORKER_SCHEDULER_ENABLED: "0"
      REDIS_URL: redis://quant_redis:6379/0
      DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
      RUNS_QUEUE_NAME: runs
      DEFAULTS_DISCOVERY_QUEUE_NAME: defaults_discovery
      MARKET_REFRESH_QUEUE_NAME: market_refresh
      SIGNAL_ENGINE_QUEUE_NAME: signal_engine
      SIGNAL_BACKTEST_QUEUE_NAME: signal_backtest
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: quant-artifacts
      PYTHONPATH: /repo
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
    command: python -m services.worker.scheduler

  quant_api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      API_WORKERS: ${API_WORKERS:-4}
      REDIS_URL: redis://quant_redis:6379/0
      DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
      API_EMBEDDED_SCHEDULER_ENABLED: "0"
      SNAPSHOT_READ_MODE_OVERRIDES: dashboard=snapshot
      RUN_JOB_TIMEOUT_SECONDS: "21600"
      RUN_JOB_RESULT_TTL_SECONDS: "86400"
      RUN_JOB_FAILURE_TTL_SECONDS: "604800"
      RUN_JOB_RETRY_MAX: "0"
      RUN_JOB_RETRY_INTERVAL_SECONDS: "60"
      RUNS_QUEUE_NAME: runs
      DEFAULTS_DISCOVERY_QUEUE_NAME: defaults_discovery
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: quant-artifacts
      S3_SECURE: "false"
      API_KEY: ${API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ADMIN_SCOPES: ${ADMIN_SCOPES:-admin}
      BLOOMBERG_BRIDGE_API_KEY: ${BLOOMBERG_BRIDGE_API_KEY:-local-bloomberg-bridge-key}
      BLOOMBERG_BRIDGE_MAX_UPLOAD_BYTES: ${BLOOMBERG_BRIDGE_MAX_UPLOAD_BYTES:-268435456}
      FUNDAMENTAL_LLM_API_KEYS: ${FUNDAMENTAL_LLM_API_KEYS:-}
      FUNDAMENTAL_LLM_MODEL: ${FUNDAMENTAL_LLM_MODEL:-gemma-4-31b-it}
      FUNDAMENTAL_LLM_BASE_URL: ${FUNDAMENTAL_LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      PYTHONPATH: /repo
    depends_on:
      quant_postgres:
        condition: service_healthy
      quant_redis:
        condition: service_started
      quant_minio:
        condition: service_started
      quant_minio_init:
        condition: service_completed_successfully
      quant_db_migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ../services/api:/repo/services/api
      - ../services/worker:/repo/services/worker   # ← add
      - ../core:/repo/core
      - ../data:/repo/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - << 'PY'

            import urllib.request

            urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()

            print('ok')

            PY"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  quant_frontend:
    profiles: ["frontend-container"]
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      UPSTREAM_API_BASE: http://quant_api:8000
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-120000}
      API_KEY: ${API_KEY:-}
      DATABASE_URL: postgresql://app:app@quant_postgres:5432/quant
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-demo-auth-secret-change-me}
      AUTH_SECRET: ${AUTH_SECRET:-local-demo-auth-secret-change-me}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-stg.tdazine@bmcek.co.ma}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      DASHBOARD_PUBLIC_ONLY: ${DASHBOARD_PUBLIC_ONLY:-true}
    depends_on:
      quant_api:
        condition: service_healthy
      quant_postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Airflow services — only start with: docker compose --profile airflow up
  # ---------------------------------------------------------------------------

  airflow_init:
    profiles: ["airflow"]
    build:
      context: ..
      dockerfile: infra/airflow/Dockerfile
    environment:
      <<: *airflow_env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _AIRFLOW_WWW_USER_FIRSTNAME: Admin
      _AIRFLOW_WWW_USER_LASTNAME: User
      _AIRFLOW_WWW_USER_EMAIL: admin@localhost
      _AIRFLOW_WWW_USER_ROLE: Admin
      # psql creds for CREATE DATABASE guard
      PGPASSWORD: app
    depends_on:
      quant_postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "==> Checking whether 'airflow' database exists..."
        # Connect to the 'postgres' maintenance DB: psql -U app with no -d defaults to a
        # database named after the user ('app'), which does not exist (the app DB is 'quant').
        if PGPASSWORD=app psql -h quant_postgres -U app -d postgres -lqt | cut -d'|' -f1 | grep -qw airflow; then
          echo "    Database 'airflow' already exists — skipping creation."
        else
          echo "    Creating database 'airflow'..."
          PGPASSWORD=app psql -h quant_postgres -U app -d postgres -c "CREATE DATABASE airflow"
        fi
        echo "==> Running airflow db migrate..."
        airflow db migrate
        echo "==> Creating admin user (idempotent)..."
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@localhost \
          || true
        echo "==> airflow_init complete."
    restart: "no"

  airflow_scheduler:
    profiles: ["airflow"]
    build:
      context: ..
      dockerfile: infra/airflow/Dockerfile
    environment:
      <<: *airflow_env
    depends_on:
      airflow_init:
        condition: service_completed_successfully
      quant_postgres:
        condition: service_healthy
      quant_api:
        condition: service_healthy
    volumes:
      - ../dataeng:/opt/dataeng
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: airflow scheduler
    restart: unless-stopped

  airflow_webserver:
    profiles: ["airflow"]
    build:
      context: ..
      dockerfile: infra/airflow/Dockerfile
    environment:
      <<: *airflow_env
    depends_on:
      airflow_init:
        condition: service_completed_successfully
      quant_postgres:
        condition: service_healthy
    volumes:
      - ../dataeng:/opt/dataeng
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    ports:
      - "8081:8080"
    command: airflow webserver
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  featurecache:
  airflow_logs:
