x-wfo-worker-base: &wfo_worker_base
  build:
    context: ..
    dockerfile: services/worker/Dockerfile
  environment:
    REDIS_URL: redis://quant_redis:6379/0
    DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
    RUNS_QUEUE_NAME: runs
    DEFAULTS_DISCOVERY_QUEUE_NAME: defaults_discovery
    WORKER_QUEUES: wfo_signals
    RUN_HEARTBEAT_INTERVAL_SECONDS: "15"
    RUN_ORPHAN_STALE_SECONDS: "600"
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio12345}
    S3_BUCKET: quant-artifacts
    S3_SECURE: "false"
    PYTHONPATH: /repo
  depends_on:
    quant_postgres:
      condition: service_healthy
    quant_redis:
      condition: service_healthy
    quant_minio:
      condition: service_healthy
  command: python -m services.worker.worker
  restart: unless-stopped

services:
  quant_postgres:
    image: postgres:16
    container_name: quant_postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: quant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d quant"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  quant_redis:
    image: redis:7
    container_name: quant_redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  quant_minio:
    image: minio/minio
    container_name: quant_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    networks:
      default:
        aliases:
          - minio
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  quant_api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    container_name: quant_api
    environment:
      REDIS_URL: redis://quant_redis:6379/0
      DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
      RUN_JOB_TIMEOUT_SECONDS: "21600"
      RUN_JOB_RESULT_TTL_SECONDS: "86400"
      RUN_JOB_FAILURE_TTL_SECONDS: "604800"
      RUN_JOB_RETRY_MAX: "0"
      RUN_JOB_RETRY_INTERVAL_SECONDS: "60"
      RUNS_QUEUE_NAME: runs
      DEFAULTS_DISCOVERY_QUEUE_NAME: defaults_discovery
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio12345}
      S3_BUCKET: quant-artifacts
      S3_SECURE: "false"
      API_KEY: ${API_KEY:-}
      PYTHONPATH: /repo
    depends_on:
      quant_postgres:
        condition: service_healthy
      quant_redis:
        condition: service_healthy
      quant_minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python - << 'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\nprint('ok')\nPY"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  quant_worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    container_name: quant_worker
    environment:
      REDIS_URL: redis://quant_redis:6379/0
      DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
      RUNS_QUEUE_NAME: runs
      DEFAULTS_DISCOVERY_QUEUE_NAME: defaults_discovery
      WORKER_QUEUES: runs,market_refresh,signal_engine,signal_backtest,score_history
      SIGNAL_ENGINE_REFRESH_ON_MARKET_REFRESH: "1"
      RUN_HEARTBEAT_INTERVAL_SECONDS: "15"
      RUN_ORPHAN_STALE_SECONDS: "600"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio12345}
      S3_BUCKET: quant-artifacts
      S3_SECURE: "false"
      PYTHONPATH: /repo
    depends_on:
      quant_postgres:
        condition: service_healthy
      quant_redis:
        condition: service_healthy
      quant_minio:
        condition: service_healthy
    command: python -m services.worker.worker
    restart: unless-stopped

  quant_worker_defaults:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    container_name: quant_worker_defaults
    environment:
      REDIS_URL: redis://quant_redis:6379/0
      DATABASE_URL: postgresql+psycopg2://app:app@quant_postgres:5432/quant
      RUNS_QUEUE_NAME: runs
      DEFAULTS_DISCOVERY_QUEUE_NAME: defaults_discovery
      WORKER_QUEUES: defaults_discovery
      RUN_HEARTBEAT_INTERVAL_SECONDS: "15"
      RUN_ORPHAN_STALE_SECONDS: "600"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio12345}
      S3_BUCKET: quant-artifacts
      S3_SECURE: "false"
      PYTHONPATH: /repo
    depends_on:
      quant_postgres:
        condition: service_healthy
      quant_redis:
        condition: service_healthy
      quant_minio:
        condition: service_healthy
    command: python -m services.worker.worker
    restart: unless-stopped

  quant_worker_wfo:
    <<: *wfo_worker_base

  quant_frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: quant_frontend
    environment:
      UPSTREAM_API_BASE: http://quant_api:8000
      API_KEY: ${API_KEY:-}
      ARTIFACT_MINIO_HOST: minio
      ARTIFACT_MINIO_PUBLIC_ORIGIN: http://minio:9000
      NODE_ENV: production
    depends_on:
      quant_api:
        condition: service_healthy
    restart: unless-stopped

  edge_proxy:
    image: caddy:2-alpine
    container_name: edge_proxy
    environment:
      DOMAIN: ${DOMAIN:-34.123.220.144.sslip.io}
    depends_on:
      - quant_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.gcp:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
